version: '3.8'

services:
  account-db:
    image: postgres:15-alpine
    container_name: account_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: account_db
    volumes:
      - account-db-data:/var/lib/postgresql/data

volumes:
  account-db-data:
