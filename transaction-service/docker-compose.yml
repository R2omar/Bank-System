version: '3.8'

services:
  transaction-db:
    image: postgres:15-alpine
    container_name: transaction_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transaction_db
    volumes:
      - transaction-db-data:/var/lib/postgresql/data

volumes:
  transaction-db-data:
